apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: turfbuilder
  labels:
    app: turfbuilder
spec:
  gatewayClassName: cilium
  listeners:
    # HTTP listener - Cloudflare proxies here after TLS termination
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same  # Only routes from turfbuilder namespace