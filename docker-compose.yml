name: turfbuilder
services:
  postgres:
    platform: linux/amd64
    image: postgis/postgis:18-3.6
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=db_password
      - POSTGRES_DB=postgres
      - TZ=${TZ}
    shm_size: 128mb
    networks:
      - turfbuilder
    restart: ${RESTART_POLICY}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:db_password@postgres:5432/postgres
      - BETTER_AUTH_SECRET=ODiDH4PwSD2KxDoVu7jVfkxooICq5m1P # DO NOT USE IN PRODUCTION! THIS SECRET IS PUBLIC AND ONLY FOR DEV USE!
      - BETTER_AUTH_URL=http://localhost:3000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    depends_on:
      - postgres
    networks:
      - turfbuilder
    restart: unless-stopped
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=development
      - DOCKER=true
      - DATABASE_URL=postgres://postgres:db_password@postgres:5432/postgres
      - BETTER_AUTH_SECRET=ODiDH4PwSD2KxDoVu7jVfkxooICq5m1P # DO NOT USE IN PRODUCTION! THIS SECRET IS PUBLIC AND ONLY FOR DEV USE!
      - BETTER_AUTH_URL=http://localhost:5173
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # Object storage comes from the s3 service below unless .env sets real keys.
      # s3mock accepts any credentials.
      - SPACES_ACCESS_KEY_ID=${SPACES_ACCESS_KEY_ID:-dev-access-key}
      - SPACES_SECRET_ACCESS_KEY=${SPACES_SECRET_ACCESS_KEY:-dev-secret-key}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - s3
    networks:
      - turfbuilder
    restart: unless-stopped

  # S3-compatible stand-in for DigitalOcean Spaces, for local development.
  # The app reaches it as http://s3:9090. Presigned links carry that name, so the
  # browser must resolve it too: add `127.0.0.1 s3` to /etc/hosts. Files are lost
  # when the container is removed. Point the app at it with these settings:
  #   spaces.endpoint = http://s3:9090, spaces.region = us-east-1, spaces.bucket = turfbuilder-dev
  s3:
    image: adobe/s3mock:4.7.0
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=turfbuilder-dev
    ports:
      - '9090:9090'
    networks:
      - turfbuilder
    restart: unless-stopped

  nats:
    image: nats:2.10
    restart: unless-stopped
    command: [
      "-js",
      "-m", "8222",
      "--store_dir", "/data/jetstream"
    ]
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # monitoring
    volumes:
      - nats_data:/data/jetstream
    networks:
      - turfbuilder
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:latest
    environment:
      - SPAN_STORAGE_TYPE=memory
      - METRICS_STORAGE_TYPE=prometheus
    ports:
      - "16686:16686"
      - "4318:4318"
    networks:
      - turfbuilder
volumes:
  postgres_data:
  nats_data:
networks:
  turfbuilder:
    driver: bridge