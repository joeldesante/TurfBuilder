apiVersion: apps/v1
kind: Deployment
metadata:
  name: turfbuilder-staging
  namespace: turfbuilder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: turfbuilder
      env: staging
  template:
    metadata:
      labels:
        app: turfbuilder
        env: staging
    spec:
      containers:
        - name: turfbuilder
          image: ghcr.io/joeldesante/turfbuilder:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: staging
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: turfbuilder-secrets-staging
            - secretRef:
                name: aws-ses-env
            # OTLP auth headers (OTEL_EXPORTER_OTLP_LOGS_HEADERS, ..._TRACES_HEADERS).
            # Created by hand in the cluster, never committed; optional so a
            # cluster without it still starts, just without authenticated export.
            - secretRef:
                name: turfbuilder-telemetry-staging
                optional: true
          volumeMounts:
            - name: db-ca
              mountPath: /etc/ssl/db-ca
              readOnly: true
      volumes:
        - name: db-ca
          secret:
            secretName: turfbuilder-db-ca
---
apiVersion: v1
kind: Service
metadata:
  name: turfbuilder-staging-svc
  namespace: turfbuilder
spec:
  selector:
    app: turfbuilder
    env: staging
  ports:
    - port: 80
      targetPort: 3000
