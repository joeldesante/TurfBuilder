name: Test

# Runs on every pull request into staging or main, so problems are caught
# before merging. Make these checks required in branch protection so a red
# PR cannot be merged.
on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR when new commits land.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run svelte-check
        run: npm run check

  unit:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node-environment tests: no browser needed, so skip the install.
          - name: server
            command: npx vitest run --project server
            browser: false
          # Component tests run in real Chromium via vitest browser mode.
          # Specs that call vi.mock() run one per process (see vite.config.ts
          # and scripts/test-mocking-specs.mjs).
          - name: client
            command: npx vitest run --project client && npm run test:unit:mocks
            browser: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: matrix.browser
        run: npx playwright install chromium --with-deps

      - name: Run ${{ matrix.name }} tests
        run: ${{ matrix.command }}
        env:
          CI: true

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Postgres, the app and NATS all come from docker-compose.test.yml, which
    # Playwright's webServer boots. Keeping them here too would fight over port 5432.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test --workers=2
        env:
          CI: true

      - name: Dump stack logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Tear down stack
        if: ${{ !cancelled() }}
        run: docker compose -f docker-compose.test.yml down -v

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
